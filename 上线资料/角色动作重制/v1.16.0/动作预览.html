<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>四位搭子 · 动作预览 v1.16.3</title><style>*{box-sizing:border-box}body{margin:0;background:#faf9f6;color:#35404a;font:15px/1.7 system-ui,sans-serif;padding:28px;max-width:1100px;margin:auto}h1{font-size:26px;margin:0}p{color:#687079}main{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}.card{padding:20px;border-radius:24px;border:1px solid #e5e5e5}h2{margin:0;font-size:19px}.stage{height:190px;display:flex;align-items:flex-end;justify-content:center}.pet{width:160px;height:160px;overflow:hidden;position:relative}.pet img{display:block;width:1280px;height:1280px;max-width:none}button{font:inherit;cursor:pointer;background:#fff;border:1px solid #ddd;border-radius:12px;padding:7px 14px;margin:3px}button:hover{border-color:#888}.controls{display:flex;flex-wrap:wrap;justify-content:center}.status{text-align:center;color:#77808a;min-height:24px;font-size:13px}.lead{margin-bottom:22px}@media(max-width:620px){body{padding:18px}main{grid-template-columns:1fr}}</style><h1>四位搭子 · 新动作预览</h1><p class="lead">待机和完成动作已放慢。点击左右跑步，观看角色跟随一次转盘的速度逐渐放慢；可以暂停检查轮廓和脚部。<br>转盘实际排版与手势，请打开 <a href="http://127.0.0.1:8793/?v=1.16.0">小程序交互预览</a>。</p><main><section class="card" style="background:#fff3f8" data-pet="pink-pastry-girl"><h2>草莓甜心小厨</h2><div class="stage"><div class="pet"><img src="小程序图集/pink-pastry-girl.png" alt="草莓甜心小厨"></div></div><div class="status">待机 · 一轮 2.88 秒</div><div class="controls"><button data-action="idle">待机</button><button data-action="left">向左跑</button><button data-action="right">向右跑</button><button data-action="done">完成</button><button data-action="pause">暂停</button></div></section><section class="card" style="background:#f1faf4" data-pet="milk-tea-puppy"><h2>奶茶小狗</h2><div class="stage"><div class="pet"><img src="小程序图集/milk-tea-puppy.png" alt="奶茶小狗"></div></div><div class="status">待机 · 一轮 2.88 秒</div><div class="controls"><button data-action="idle">待机</button><button data-action="left">向左跑</button><button data-action="right">向右跑</button><button data-action="done">完成</button><button data-action="pause">暂停</button></div></section><section class="card" style="background:#f1f5ff" data-pet="lazy-yawn-cat"><h2>慵懒小猫</h2><div class="stage"><div class="pet"><img src="小程序图集/lazy-yawn-cat.png" alt="慵懒小猫"></div></div><div class="status">待机 · 一轮 2.88 秒</div><div class="controls"><button data-action="idle">待机</button><button data-action="left">向左跑</button><button data-action="right">向右跑</button><button data-action="done">完成</button><button data-action="pause">暂停</button></div></section><section class="card" style="background:#fff8e9" data-pet="baozi-sous-chef"><h2>包仔小厨</h2><div class="stage"><div class="pet"><img src="小程序图集/baozi-sous-chef.png" alt="包仔小厨"></div></div><div class="status">待机 · 一轮 2.88 秒</div><div class="controls"><button data-action="idle">待机</button><button data-action="left">向左跑</button><button data-action="right">向右跑</button><button data-action="done">完成</button><button data-action="pause">暂停</button></div></section></main><script>const motion=(()=>{const module={exports:{}};// A single phase clock drives the sprite, so changing speed never restarts a GIF.
const DONE_MS=1750;
const ROWS={idle:0,runRight:1,runLeft:2,done:3};
function cubic(t,a,b){const s=1-t;return 3*s*s*t*a+3*s*t*t*b+t*t*t;}
function derivative(t,a,b){const s=1-t;return 3*s*s*a+6*s*t*(b-a)+3*t*t*(1-b);}
function spinSpeed(from,to,duration,elapsed){
  if(duration<=0||elapsed>=duration)return 0;
  const x=Math.max(0,elapsed/duration);let lo=0,hi=1;
  for(let i=0;i<22;i++){const t=(lo+hi)/2;if(cubic(t,.12,.12)<x)lo=t;else hi=t;}
  const t=(lo+hi)/2;
  return Math.abs(to-from)/duration*derivative(t,.72,1)/derivative(t,.12,.12);
}
function frameRate(speed){
  const velocity=Math.abs(speed);
  // Keep the gait legible at the end of a spin without holding individual poses.
  return velocity>0?6+22*velocity/(velocity+.35):0;
}
function createPlayer(render,clock={now:()=>Date.now(),set:(f,t)=>setTimeout(f,t),clear:t=>clearTimeout(t)}){
  let timer=null,state='idle',phase=0,last=0,started=0,mode='idle',spin,dragSpeed=0,dragAt=0,active=false,lastKey='';
  function paint(){
    const frame=state==='done'?Math.min(11,Math.floor((clock.now()-started)/140)):Math.floor(phase)%16;
    const key=state+':'+frame;
    if(key!==lastKey){lastKey=key;render({petFrame:frame,petColumn:frame%8,petRow:ROWS[state]*2+Math.floor(frame/8)});}
  }
  function tick(){
    timer=null;if(!active)return;
    const now=clock.now(),dt=Math.min(100,Math.max(0,now-last));last=now;
    let fps=1000/180;
    if(mode==='spin')fps=frameRate(spinSpeed(spin.from,spin.to,spin.duration,now-spin.at));
    else if(mode==='drag')fps=frameRate(now-dragAt>220?0:dragSpeed*Math.exp(-Math.max(0,now-dragAt-60)/70));
    phase+=dt*fps/1000;paint();
    if(state==='done'&&now-started>=1680){active=false;return;}
    timer=clock.set(tick,20);
  }
  function start(next,nextMode){
    const wasRunning=state==='runRight'||state==='runLeft';
    const willRun=next==='runRight'||next==='runLeft';
    if(next!==state&&!(wasRunning&&willRun)){phase=0;started=clock.now();last=started;}
    state=next;mode=nextMode;
    if(!active){active=true;last=clock.now();started=last;}
    paint();if(timer===null)timer=clock.set(tick,20);
  }
  return {
    idle(){start('idle','idle');},
    drag(speed,direction){dragSpeed=Math.abs(speed);dragAt=clock.now();start(direction>0?'runRight':'runLeft','drag');},
    spin(from,to,duration){spin={from,to,duration,at:clock.now()};start(to>from?'runRight':'runLeft','spin');},
    done(){phase=0;started=clock.now();start('done','done');},
    stop(){active=false;clock.clear(timer);timer=null;},
    reset(){this.stop();state='idle';phase=0;lastKey='';paint();},
    status(){return {active,state,phase,mode};}
  };
}
module.exports={createPlayer,spinSpeed,frameRate,DONE_MS};
;return module.exports;})();for(const card of document.querySelectorAll('.card')){const img=card.querySelector('img'),label=card.querySelector('.status');const p=motion.createPlayer(({petColumn,petRow})=>{img.style.transform=`translate(${-petColumn*160}px,${-petRow*160}px)`;});let finish;img.addEventListener('load',()=>p.idle(),{once:true});if(img.complete)p.idle();card.addEventListener('click',e=>{const action=e.target.dataset.action;if(!action)return;clearTimeout(finish);if(action==='idle'){p.idle();label.textContent='待机 · 一轮 2.88 秒';}else if(action==='pause'){p.stop();label.textContent='已暂停';}else if(action==='done'){p.done();label.textContent='完成 · 12 帧舒缓收势';}else{p.spin(0,action==='left'?-2000:2000,4200);label.textContent='跑步随盘速变化 · 保持 6–28 帧/秒';finish=setTimeout(()=>{p.done();label.textContent='停盘，播放完成动作';},4200);}});}</script></html>
